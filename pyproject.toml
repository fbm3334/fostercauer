[project]
name = "fostercauer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Finn Beckitt-Marshall", email = "finn@pictura.co.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "marimo>=0.23.16",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "sympy>=1.14.0",
]

[project.scripts]
fostercauer = "fostercauer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
